# Rebuilds and signs the index every hour (new releases of listed plugins), and
# whenever main changes. Building downloads and unpacks third-party packages, so
# it runs without the signing key; the signing job gets only the built
# index.json, needs no dependencies and is the only one in the "release"
# environment, whose secret holds the key and which only main may use.
name: Update index

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "revoked.json"
      - "keys/**"
      - "scripts/**"
      - "package*.json"
      - ".github/workflows/update-index.yml"
  workflow_dispatch:

concurrency:
  group: update-index
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      outcome: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the index
        id: build
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-index.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: index
          path: index.json
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: index
          path: built
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Sign
        env:
          FOCUSD_PLUGIN_SIGNING_KEY: ${{ secrets.FOCUSD_PLUGIN_SIGNING_KEY }}
        run: |
          cp built/index.json index.json
          rm -rf built
          node scripts/sign.mjs
      - name: Commit
        run: |
          git add index.json index.json.sig revoked.json revoked.json.sig
          if git diff --cached --quiet; then
            echo "The index did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(index): update the plugin index"
          git push
      - name: Report build errors
        if: needs.build.outputs.outcome == 'failure'
        run: |
          echo "Some plugins could not be updated; see the build job and its summary."
          exit 1
